name: notebook-db

services:
  db:
    image: postgres:17-alpine
    container_name: notebook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: y75dTQHwg8vj86lo08ZuJ7Crqfk
      POSTGRES_DB: travel_board
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - notebook-network
    # Pas de port publié : la base n'est joignable que par les conteneurs du réseau.
    # Pour y accéder depuis ton Mac via un tunnel SSH, décommente (écoute uniquement en local sur le VPS) :
    # ports:
    #   - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "notebook" -d "travel_board"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    # Nom fixe : les données survivent à `docker compose down` (sauf avec -v)
    name: notebook-pgdata

networks:
  notebook-network:
    external: true
